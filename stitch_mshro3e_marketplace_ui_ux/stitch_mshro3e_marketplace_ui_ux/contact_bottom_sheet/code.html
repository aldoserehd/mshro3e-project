<style>

        }
        .backdrop-dim {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }
        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        body {
            background-color: #faf8ff;
            font-family: 'Inter', sans-serif;

<body class="antialiased overflow-hidden">
<!-- Background Content: Dimmed Product Detail Screen -->

<!-- Top App Bar (Backgrounded) -->
<header class="fixed top-0 left-0 w-full z-10 flex justify-between items-center px-lg py-sm bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<span class="material-symbols-outlined text-secondary">arrow_back</span>
<span class="text-headline-md font-headline-md font-bold text-primary">Mshro3e</span>
<span class="material-symbols-outlined text-secondary">share</span>
</header>
<!-- Product Content (Simplified Background) -->
<div class="pt-[72px] px-lg">
<div class="aspect-square w-full rounded-xl overflow-hidden mb-lg">
<img class="w-full h-full object-cover" data-alt="A premium luxury wrist watch displayed on a minimalist white stone pedestal. The lighting is soft and professional, emphasizing the metallic textures and navy blue dial. The background is a clean, corporate navy-50 tone, maintaining a high-end retail marketplace aesthetic suitable for a sophisticated Kuwaiti audience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCn2gr7vVPLOKNSyE2c1E_yGL0C9zqInODNy2eUghWcIt-9NmlMQKfSZO2lPHgkDnsK0_4VhDy678q5eKaUP7OI0MwCyuKrn51VrVEWSLiQxT9eipduqBxeT1Sbc4ODTnJ6i9KEc3A5x7TRJ9-Wc8He00Y0LpHY2z3UxscVPwhkb2hgF05g0NvBfi-36HrsAkujKyFXCaAjoKIXXQpJqzakFOhB0whE9XTIvVbdWV0-Adkx4lRdDDz99IF1U9ptm4ukKIUWs3TZAnAx"/>
</div>
<div class="h-8 w-3/4 bg-on-surface-variant/20 rounded-md mb-md"></div>
<div class="h-4 w-1/2 bg-on-surface-variant/10 rounded-md mb-xl"></div>
<div class="grid grid-cols-4 gap-md">
<div class="aspect-square bg-on-surface-variant/10 rounded-lg"></div>
<div class="aspect-square bg-on-surface-variant/10 rounded-lg"></div>
<div class="aspect-square bg-on-surface-variant/10 rounded-lg"></div>
<div class="aspect-square bg-on-surface-variant/10 rounded-lg"></div>
</div>
</div>
<!-- Dimmed Overlay -->
<div class="absolute inset-0 z-20 backdrop-dim"></div>
</main>
<!-- Contact Bottom Sheet Overlay -->
<div class="fixed inset-0 z-50 flex flex-col justify-end">
<!-- Overlay Click Area -->
<div class="flex-grow" onclick="closeSheet()"></div>
<!-- Sheet Body -->
<div class="bottom-sheet bg-surface rounded-t-[32px] w-full max-w-[600px] mx-auto h-[55%] flex flex-col shadow-2xl border-t border-outline-variant/30" id="bottom-sheet">
<!-- Handle -->
<div class="w-full flex justify-center py-md">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-xl pb-xl flex flex-col h-full overflow-y-auto">
<!-- Header -->
<div class="flex justify-between items-center mb-lg">
<h2 class="text-headline-md font-headline-md text-on-surface">تواصل مع البائع</h2>
<button class="p-sm rounded-full hover:bg-surface-variant transition-colors" onclick="closeSheet()">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Product Preview Card -->
<div class="flex items-center gap-lg p-lg bg-surface-container-low border border-outline-variant/30 rounded-xl mb-xl">
<div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Close up of a luxury blue dial watch face with silver markers, highlighting the intricate detail and premium craftmanship. The image is set against a clean, light studio background that creates a bright, modern light-mode aesthetic, reflecting high trust and quality for a premium vendor marketplace." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJlHJdPCGSu2VRFtcdj-IhLh1YzMMfMaL3iV0CBGQDacWchsNtYGAXC4_r6ZDSaUPwsKVc4xj6jndn_SQErac0nX8kzN9MqAIaIy1nOWn1HyRwYwGD9xmyMDfj0y4mSYhOb-rMsG0Ng3I_JcarBPE9cwcKn-1eokJjGCQFEHZdSXyFXPXJN_-YwIz9OWT_gpnPfnuGXKpG7r1EV1j6HJYBtlco4umgcdGImdszfdtko4Ut9sSHNtxdLvRFZXDPskYSgbLTL1eACZ8o"/>
</div>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-secondary">تفاصيل المنتج</span>
<h3 class="text-body-md font-bold text-on-surface">ساعة كلاسيكية فاخرة</h3>
<span class="text-headline-md font-headline-md text-primary">45.000 ك.د</span>
</div>
</div>
<!-- WhatsApp Message Preview -->
<div class="mb-xl">
<label class="text-label-md font-label-md text-on-surface-variant mb-xs block">معاينة الرسالة</label>
<div class="p-lg bg-surface-container-highest/30 rounded-xl border border-outline-variant/20 italic text-on-surface-variant text-body-md leading-relaxed text-right">
                        "مرحباً، استفسر عن ساعة كلاسيكية فاخرة بـ 45.000 ك.د"
                    </div>
</div>
<!-- Action Buttons -->
<div class="mt-auto space-y-md">
<button class="w-full py-lg bg-primary-container text-on-primary rounded-[10px] flex items-center justify-center gap-md hover:opacity-90 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="text-label-md font-label-md">ارسال رسالة واتساب</span>
</button>
<button class="w-full py-lg border border-primary-container text-primary-container rounded-[10px] flex items-center justify-center gap-md hover:bg-surface-container-high transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">mail</span>
<span class="text-label-md font-label-md">ارسال رسالة في التطبيق</span>
</button>
</div>

<div class="h-6"></div>
</div>
</div>
</div>
<!-- Navigation Shell (Suppressed due to Overlay Context) -->
<script>
        function closeSheet() {
            const sheet = document.getElementById('bottom-sheet');
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => {
                // In a real app, this would route back or hide the overlay
                alert("Sheet dismissed");
            }, 300);
        }

        // Handle micro-interaction for entry
        window.onload = () => {
            const sheet = document.getElementById('bottom-sheet');
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => {
                sheet.style.transform = 'translateY(0)';
            }, 50);
        };
    </script>
</body></html>

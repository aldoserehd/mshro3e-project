<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .navy-gradient {
        background: linear-gradient(180deg, #151b2c 0%, #001a41 100%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface antialiased overflow-hidden">
<!-- Onboarding Shell: Suppressing Global Nav because it is a linear/transactional screen -->
<main class="relative h-screen w-full navy-gradient flex flex-col items-center justify-between px-xl py-4xl">
<!-- Top Bar (Header) -->
<header class="w-full flex justify-start items-center">
<button class="font-label-md text-label-md text-on-secondary-container hover:text-white transition-colors duration-200">
                يطّخت
            </button>
</header>
<!-- Illustration Content -->
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-md gap-2xl">
<div class="relative w-full aspect-square flex items-center justify-center">
<!-- Decorative background elements -->
<div class="absolute inset-0 bg-secondary/10 rounded-full blur-3xl scale-90"></div>
<!-- Main Illustration Card -->
<div class="relative z-10 glass-card rounded-3xl p-lg animate-float overflow-hidden shadow-2xl">
<img alt="Kuwaiti artisan baking" class="rounded-2xl w-full h-full object-cover aspect-square grayscale-[0.2] hover:grayscale-0 transition-all duration-700" data-alt="A high-end cinematic photograph of a professional Kuwaiti artisan baker in a modern, sun-drenched kitchen. The scene is bathed in soft, warm golden hour lighting that highlights flour dusting the air. The aesthetic is sophisticated and minimalist, featuring a palette of deep navy blues, crisp whites, and warm wooden textures. The baker is meticulously decorating a traditional contemporary cake, capturing a sense of craftsmanship, trust, and premium home-grown quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCblxwS3XQ_jLcVWj3zIVWN2xrSf_3wxK0cgbtwt72-shJZjUrdmnOLxa1FTkYnW130AdiNuTw5Z-me6Z2bf2FUrQRjXpkUByx2KHKcaW-RMXokjntRFL0sxSGQDCnVxG3Lw1-ktnN8e60ScEhI5QvZ7ZyAUJqr_cYuEDMrdKckRfjcG2PTgc2RJIPjVRBksbVSHPzy5QmN1fhb0OmGAI9r4Ct2QrSd1GqojG58JnZHx7k4vWUFgJTc_yJu3erFdSS4ZuvUrP25J9iP"/>
</div>
<!-- Floating Decorative Accent -->
<div class="absolute -bottom-4 -right-4 glass-card p-md rounded-xl flex items-center gap-md shadow-lg border-secondary/20">
<div class="w-10 h-10 bg-secondary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[20px]">local_mall</span>
</div>
<div>
<div class="font-label-md text-[12px] text-secondary-fixed opacity-70">صُنع في الكويت</div>
<div class="font-headline-md text-sm text-white">مشروعي المميز</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-white tracking-tight">
                    نآلا أدبا
                </h1>
<p class="font-body-md text-body-md text-secondary-fixed/80 max-w-[280px] mx-auto leading-relaxed">
                    ادعم المشاريع الكويتية الصغيرة وتسوق من بيوت مبدعينا.
                </p>
</div>
</div>
<!-- Footer Actions -->
<footer class="w-full max-w-md flex flex-col items-center gap-2xl">
<!-- Pagination Dots -->
<div class="flex gap-sm">
<span class="w-2 h-2 rounded-full bg-secondary/30"></span>
<span class="w-2 h-2 rounded-full bg-secondary/30"></span>
<span class="w-6 h-2 rounded-full bg-secondary-container transition-all duration-500"></span>
</div>
<!-- CTA Button -->
<button class="w-full py-lg bg-secondary text-white font-headline-md text-headline-md rounded-xl shadow-xl shadow-secondary/20 hover:bg-secondary/90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-md group">
                نآلا أدبا
                <span class="material-symbols-outlined group-hover:translate-x-[-4px] transition-transform duration-200">arrow_back</span>
</button>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cta = document.querySelector('button.bg-secondary');
            cta.addEventListener('mouseenter', () => {
                const icon = cta.querySelector('.material-symbols-outlined');
                icon.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });

            // Gentle parallax for the glass card
            document.addEventListener('mousemove', (e) => {
                const card = document.querySelector('.glass-card');
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });
    </script>
